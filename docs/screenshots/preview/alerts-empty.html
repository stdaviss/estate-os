<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Alerts</title>
  <link rel="stylesheet" href="/apps/web/app/schedule/_lib/c-lane.css"/>
  
</head>
<body>
<main class="c-page"><header class="c-page-head"><h1 class="c-display-l">Alerts</h1></header><div class="c-empty"><div class="c-label">Alerts</div><p class="c-body-l">Pick the genres you care about and we'll tell you when they're scheduled. That's the only thing we'll use it for.</p><a class="c-btn c-btn-primary" href="#">Choose genres</a></div><form id="choose">
    <label class="c-field"><span>Genre</span><select><option>Techno</option><option>Dub techno</option></select></label>
    <label class="c-field"><span>Artist</span><select><option>None</option><option>Palais Gris</option></select></label>
    <label class="c-field"><span>Channel</span><select><option>Email</option><option>Web push</option></select></label>
    <label class="c-field"><span>Lead time (minutes)</span><select><option>60</option></select></label>
    <a class="c-btn c-btn-primary" href="#">Set an alert</a>
  </form></main>
</body>
</html>
