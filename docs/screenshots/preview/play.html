<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Which mix</title>
  <link rel="stylesheet" href="/apps/web/app/schedule/_lib/c-lane.css"/>
  
</head>
<body>
<main class="c-page">
    <header class="c-page-head"><h1 class="c-display-l">Which mix</h1><span class="c-data">Dock 12</span></header>
    <p class="c-body-l" style="max-width:36em">Two cuts of Dock Lights. Play A, play B, vote. The stream is paused while you are here.</p>
    <div class="c-mix">
      <div class="c-mix-pane"><div class="c-label">A · dub cut</div><h2 class="c-display-m" style="margin:12px 0">Dock Lights</h2><a class="c-btn c-btn-ghost" href="#">Play A</a><a class="c-btn c-btn-ghost" href="#">Vote A</a></div>
      <div class="c-mix-pane"><div class="c-label">B · peak cut</div><h2 class="c-display-m" style="margin:12px 0">Dock Lights</h2><a class="c-btn c-btn-ghost" href="#">Play B</a><a class="c-btn c-btn-ghost" href="#">Vote B</a></div>
    </div>
    <div class="c-split">
      <div><div class="c-label">A</div><div class="c-display-l"><span class="c-data">62%</span></div></div>
      <div><div class="c-label">B</div><div class="c-display-l"><span class="c-data">38%</span></div></div>
    </div>
    <p class="c-body-s">Keys: 1 play A, 2 play B, A vote A, B vote B.</p>
  </main>
</body>
</html>
